<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tumu AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            height: 600px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 8px;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 2px;
        }

        .message.assistant .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 2px;
        }

        .message.error .message-content {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .message-data {
            max-width: 70%;
            margin-top: 8px;
            background: white;
            border-left: 3px solid #667eea;
            padding: 12px;
            border-radius: 4px;
            font-size: 12px;
            color: #666;
            font-family: 'Monaco', 'Courier New', monospace;
            overflow-x: auto;
        }

        .message.user .message-data {
            display: none;
        }

        .input-section {
            padding: 20px;
            border-top: 1px solid #e0e0e0;
            background: white;
            display: flex;
            gap: 10px;
        }

        .input-section input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .input-section input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-section button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .input-section button:hover {
            background: #5568d3;
        }

        .input-section button:active {
            background: #4556b8;
        }

        .input-section button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .loading {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            animation: pulse 1.5s infinite;
            margin: 0 4px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            align-items: center;
            padding: 12px 16px;
        }

        @media (max-width: 600px) {
            .container {
                height: 100vh;
                max-width: 100%;
                border-radius: 0;
            }

            .message-content,
            .message-data {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Tumu AI Assistant</h1>
            <p>Logged in as: <strong>{{ actor_customer_id }}</strong></p>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="input-section">
            <input
                type="text"
                id="messageInput"
                placeholder="Ask about products, orders, discounts, refunds..."
                autocomplete="off"
            />
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        // Focus input on load
        messageInput.focus();

        // Send message on Enter key
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            // Disable input while sending
            sendBtn.disabled = true;
            messageInput.disabled = true;

            // Add user message to chat
            addMessage(message, 'user');
            messageInput.value = '';

            // Show typing indicator
            const typingMsg = addTypingIndicator();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message }),
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    addMessage(errorData.error || 'Error: Failed to get response', 'error');
                } else {
                    const data = await response.json();
                    addMessage(data.response || 'No response', 'assistant');

                    // Add data if present
                    if (data.data) {
                        addDataBlock(data.data);
                    }
                }
            } catch (error) {
                addMessage(`Error: ${error.message}`, 'error');
            } finally {
                // Re-enable input
                sendBtn.disabled = false;
                messageInput.disabled = false;
                messageInput.focus();

                // Remove typing indicator
                typingMsg.remove();

                // Scroll to bottom
                scrollToBottom();
            }
        }

        function addMessage(text, role) {
            const msgEl = document.createElement('div');
            msgEl.className = `message ${role}`;
            msgEl.innerHTML = `<div class="message-content">${escapeHtml(text)}</div>`;
            chatMessages.appendChild(msgEl);
            scrollToBottom();
            return msgEl;
        }

        function addTypingIndicator() {
            const msgEl = document.createElement('div');
            msgEl.className = 'message assistant';
            msgEl.innerHTML = `
                <div class="typing-indicator">
                    <div class="loading"></div>
                    <div class="loading" style="animation-delay: 0.2s;"></div>
                    <div class="loading" style="animation-delay: 0.4s;"></div>
                </div>
            `;
            chatMessages.appendChild(msgEl);
            scrollToBottom();
            return msgEl;
        }

        function addDataBlock(data) {
            const msgEl = document.createElement('div');
            msgEl.className = 'message assistant';
            msgEl.innerHTML = `<div class="message-data"><pre>${escapeHtml(JSON.stringify(data, null, 2))}</pre></div>`;
            chatMessages.appendChild(msgEl);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initial greeting
        window.addEventListener('load', () => {
            addMessage('Hi! I\'m your e-commerce assistant. How can I help you today? You can search for products, check your orders, apply discounts, or request refunds.', 'assistant');
        });
    </script>
</body>
</html>
